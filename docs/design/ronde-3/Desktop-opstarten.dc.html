<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#14539E}a:hover{color:#1B6AC9}
</style>
</helmet>
<div style="width: 960px; height: 620px; box-sizing: border-box; display: flex; gap: 24px; padding: 24px; background: #EBE4D9; font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; color: #2A2520">
  <section aria-label="Opstarten" style="flex: 1; border-radius: 12px; overflow: hidden; background: #FBF8F3; box-shadow: 0 2px 6px rgb(25 22 19/.08), 0 18px 48px rgb(25 22 19/.20); display: flex; flex-direction: column">
    <div style="height: 36px; background: #F4EFE7; border-bottom: 1px solid #E6DED2; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B6258">Huismus</div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px; text-align: center">
      <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 20px; background: #F4A259; display: inline-block"></span>
      <h2 style="font-size: 22px">Huismus start…</h2>
      <p class="muted small" style="max-width: 280px">Je administratie gaat zo open.</p>
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid #E3EEFB; border-top-color: #1B6AC9; display: inline-block"></span>
    </div>
  </section>
  <section aria-label="Start niet" style="flex: 1; border-radius: 12px; overflow: hidden; background: #FBF8F3; box-shadow: 0 2px 6px rgb(25 22 19/.08), 0 18px 48px rgb(25 22 19/.20); display: flex; flex-direction: column">
    <div style="height: 36px; background: #F4EFE7; border-bottom: 1px solid #E6DED2; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B6258">Huismus</div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px; text-align: center">
      <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 20px; background: #FBE4E2; display: inline-flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B8302A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></span>
      <h2 style="font-size: 22px">Huismus kon niet starten</h2>
      <p class="muted small" style="max-width: 320px">Probeer het opnieuw. Lukt het weer niet? Bewaar het logbestand en stuur het mee als je om hulp vraagt.</p>
      <div class="row" style="flex-wrap: wrap; justify-content: center">
        <button class="btn btn-primary" type="button">Opnieuw proberen</button>
        <button class="btn" type="button">Logbestand bewaren</button>
      </div>
      <p class="small muted">Foutcode: database-vergrendeld</p>
    </div>
  </section>
</div>
</x-dc>
