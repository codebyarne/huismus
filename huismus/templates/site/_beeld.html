{% comment %}A picture of the app from docs/site/ (scripts/site-beelden.sh), light or dark as the visitor's system is. name, alt; still for a screenshot (it also has a smaller file for a narrow screen), not for an animation; sizes as on an img; eager for the first one on a page.{% endcomment %}
<figure class="shot">
    <picture>
        {% if still %}<source media="(prefers-color-scheme: dark)" srcset="/beelden/{{ name }}.{{ language }}.dark.1280.webp 1280w, /beelden/{{ name }}.{{ language }}.dark.webp 2560w" sizes="{{ sizes|default:'(min-width: 900px) 600px, 100vw' }}">
        <img src="/beelden/{{ name }}.{{ language }}.light.webp" srcset="/beelden/{{ name }}.{{ language }}.light.1280.webp 1280w, /beelden/{{ name }}.{{ language }}.light.webp 2560w" sizes="{{ sizes|default:'(min-width: 900px) 600px, 100vw' }}" width="1280" height="800" alt="{{ alt }}"{% if eager %} fetchpriority="high"{% else %} loading="lazy"{% endif %} decoding="async">
        {% else %}<source media="(prefers-color-scheme: dark)" srcset="/beelden/{{ name }}.{{ language }}.dark.webp">
        <img src="/beelden/{{ name }}.{{ language }}.light.webp" width="1280" height="800" alt="{{ alt }}" loading="lazy" decoding="async">{% endif %}
    </picture>
</figure>
