<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fontconfig for the packaged desktop app on Windows (desktop/app.py):
     the system's own fonts, the user's, and a cache in the user's local
     app data. Fontconfig's Windows build fills in these names itself. -->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <dir>WINDOWSUSERFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
</fontconfig>
