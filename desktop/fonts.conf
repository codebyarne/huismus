<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fontconfig for the packaged desktop app (desktop/app.py): the system's
     own fonts, and a cache in the user's cache folder. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/Huismus/fontconfig</cachedir>
</fontconfig>
