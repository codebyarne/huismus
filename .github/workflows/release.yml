name: Release

# On a version tag (v*): builds and publishes the Docker image, and builds the
# desktop apps, Huismus-<version>-macos.dmg and Huismus-<version>-windows.exe,
# which the publish job puts on the GitHub release once both are checked: the
# files the desktop app's updates look for (huismus/core/updates.py, docs/desktop.md).
# It also puts a copy of each without the version on it, for the site's buttons.
# By hand (workflow_dispatch): a trial build of the Windows app only, which
# publishes nothing (huismus-intern/besluiten.md, "Windows-app: bouwkeuzes"). CLAUDE.md's
# own commands section already documents this split: `docker build` locally
# is native-arch only; CI/release is what builds and pushes both arm64 and
# amd64 (a Raspberry Pi is arm64; most developer/CI machines are amd64 —
# neither can natively build the other without emulation, which is what
# setup-qemu-action below is for).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    # Before anything goes out (CLAUDE.md, "Releases"): no known
    # vulnerability in the locked dependencies (pip-audit, against uv.lock
    # through `uv export`), and Django's deployment check with Docker's
    # settings, where any warning fails. Huismus runs in the user's own home
    # or tailnet, so the three warnings for a site on the open internet are
    # silenced in huismus/config/settings.py, each with its reason.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.18"

      - name: No known vulnerabilities in the dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps

      - name: Django's deployment check, with Docker's settings
        env:
          SECRET_KEY: release-security-check-only-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: "false"
          ALLOWED_HOSTS: huismus.example
        run: |
          uv python install
          uv sync --locked --no-dev
          HUISMUS_DATA_DIR="$RUNNER_TEMP/huismus-check" uv run python manage.py check --deploy --fail-level WARNING

  build-and-push:
    needs: security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-building the arm64 image on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags from the pushed git tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  macos-app:
    # Apple Silicon. Pango comes from Homebrew, whose packages here are built
    # for macOS 14, hence LSMinimumSystemVersion 14.0 in desktop/huismus.spec
    # (huismus-intern/besluiten.md, 2026-10-29).
    if: github.event_name == 'push'
    runs-on: macos-14
    env:
      # Signed with the Developer ID and notarized once its secrets are set
      # (scripts/mac-ondertekenen.sh, decided 2026-11-12); ad hoc before that.
      signing: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag must be the version inside the app
        # Otherwise the updated app reads an older version from pyproject.toml
        # and offers the same update again.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6

      - name: Install Pango (goes inside the app) and gettext
        # compilemessages needs msgfmt, which Homebrew may leave off the PATH.
        run: |
          brew install pango gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Put the Developer ID in a keychain of its own
        if: env.signing == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$MACOS_CERTIFICATE" > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
              | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
              echo "::error::No Developer ID Application certificate in MACOS_CERTIFICATE"
              exit 1
          fi
          echo "HUISMUS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build Huismus.app and the .dmg
        run: ./scripts/build-mac.sh

      - name: Check the app on an empty administration
        # Never release an app that does not start: it would reach every
        # user as an update.
        run: HUISMUS_DATA_DIR="$RUNNER_TEMP/huismus-check" dist/Huismus.app/Contents/MacOS/Huismus --check

      - name: Have Apple notarize the app and the .dmg
        if: env.signing == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          base64 --decode <<<"$APPLE_API_KEY" > "$APPLE_API_KEY_PATH"
          ./scripts/notarize-mac.sh
          rm "$APPLE_API_KEY_PATH"

      - name: Keep the .dmg for the publish job
        run: mv dist/Huismus.dmg "dist/Huismus-${version}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/Huismus-${{ env.version }}-macos.dmg
          retention-days: 3
          if-no-files-found: error

  windows-app:
    # x64, Windows 10 and later; Pango from MSYS2 (UCRT64) and the installer
    # from Inno Setup (desktop/huismus.iss). Windows minutes count twice.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The tag must be the version inside the app
        # Otherwise the updated app reads an older version from pyproject.toml
        # and offers the same update again. A trial build has no tag.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6

      - name: Install Pango (goes inside the app) and gettext
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-pango mingw-w64-ucrt-x86_64-gettext-tools

      - name: Install Inno Setup
        run: |
          if [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
              choco install innosetup --no-progress -y
          fi

      - name: Build Huismus.exe and the installer
        env:
          PANGO_BIN: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin
        run: ./scripts/build-windows.sh

      - name: Install it and check the installed app on an empty administration
        # As a user would: the installer, without any window, then the app
        # it put in place. Never release an app that does not start: it would
        # reach every user as an update. Git Bash waits for both and passes on
        # their exit codes; $LOCALAPPDATA is the folder Inno calls
        # {localappdata}. Were either not so, the check fails, never passes.
        run: |
          "dist/Huismus-${version}-windows.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          installed="$LOCALAPPDATA/Programs/Huismus/Huismus.exe"
          if ! HUISMUS_DATA_DIR="$RUNNER_TEMP/huismus-check" "$installed" --check; then
              cat "$LOCALAPPDATA/Huismus/huismus.log"
              exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/Huismus-${{ env.version }}-windows.exe
          retention-days: 3
          if-no-files-found: error

  publish:
    # Only once both apps are built and checked, and the security job is
    # green: never half a release.
    if: github.event_name == 'push'
    needs: [security, macos-app, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        # Only the two apps: build-push-action also leaves a build record
        # (*.dockerbuild) on the run, which this action fails to download.
        with:
          path: dist
          pattern: "*-app"
          merge-multiple: true

      - name: Put both apps on the release
        # A new release stays a draft until both files are on it; core.updates
        # skips drafts, so the app never sees a release without its file.
        # Publishing comes after either branch, so a re-run after a failure
        # also publishes the draft the first run left behind.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A copy under a name without the version, so the site's buttons can
          # point at releases/latest/download/<name> and always get the newest
          # (huismus/core/site.py, LATEST_ASSETS). The app's updates use the
          # names with the version.
          cp "dist/Huismus-${version}-macos.dmg" dist/Huismus-macos.dmg
          cp "dist/Huismus-${version}-windows.exe" dist/Huismus-windows.exe
          files=("dist/Huismus-${version}-macos.dmg" "dist/Huismus-${version}-windows.exe"
                 dist/Huismus-macos.dmg dist/Huismus-windows.exe)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Huismus ${version}" "${files[@]}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
